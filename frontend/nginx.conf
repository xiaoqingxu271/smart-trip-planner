server {
    listen 80;

    # 静态资源（Vite 构建产物）
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # 后端 API 反代；关闭缓冲以支持 SSE 真进度推送
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
