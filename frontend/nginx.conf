# 80 与 443 同时提供服务，不做 80→443 跳转：
# Cloudflare 代理下，若 SSL 模式为 Flexible，CF 回源走 80，强制跳转会造成循环重定向
server {
    listen 80;
    listen 443 ssl;
    http2 on;

    # Cloudflare Origin CA 证书（Full/Full strict 模式下 CF 回源校验），
    # 由 compose 以只读卷挂载 frontend/certs -> /etc/nginx/certs，私钥不入库
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 静态资源（Vite 构建产物）
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # 后端 API 反代；关闭缓冲以支持 SSE 真进度推送
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
